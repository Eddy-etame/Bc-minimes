<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Boxing Center Minimes">
  <!-- charte officielle : aplat navy, gant en os, filet argent -->
  <rect width="32" height="32" rx="7" fill="#182848"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#aebccf" stroke-width="1.4" opacity=".55"/>
  <!-- gant de boxe — la marque du Berceau -->
  <g fill="#eef1f6">
    <!-- mitaine (poing) -->
    <path d="M11 6h7a5 5 0 0 1 5 5v2.4h1.1a2.6 2.6 0 0 1 0 5.2H23v.9a4 4 0 0 1-4 4h-7.6A5.4 5.4 0 0 1 6 18.1v-6.7A5.4 5.4 0 0 1 11 6z"/>
    <!-- pouce -->
    <path d="M5.4 13.2a2.3 2.3 0 0 0 0 4.6H6v-4.6z"/>
  </g>
  <!-- poignet / manchette -->
  <rect x="10.4" y="23.8" width="9.2" height="2.7" rx="1" fill="#aebccf"/>
</svg>
